name: pi-gen manual build (hosted runner)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free disk (pi-gen can be huge on hosted runners)
      - name: Free disk space (aggressive)
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean
          df -h

      - name: Install pi-gen prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static debootstrap zerofree \
            zip dosfstools libarchive-tools rsync xz-utils \
            bc bison flex libssl-dev make pigz \
            libcap2-bin xxd file kmod gpg arch-test \
            binfmt-support

      - name: Enable binfmt_misc (host kernel)
        shell: bash
        run: |
          set -euxo pipefail
          sudo modprobe binfmt_misc
          # Ensure binfmt mount exists (usually does after modprobe)
          if [ ! -d /proc/sys/fs/binfmt_misc ]; then
            echo "binfmt_misc not available"
            exit 1
          fi
          ls -la /proc/sys/fs/binfmt_misc || true

      # Optional but often helps ensure qemu handlers are registered
      - name: Register QEMU handlers (recommended)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Clean previous outputs
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf work deploy || true

      - name: Build pi-gen image
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo ./build.sh

      - name: Compress image (zstd)
        if: false
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends zstd
          IMG="$(ls -1 deploy/*.img | head -n 1)"
          sudo zstd -T0 -10 "$IMG" -o "${IMG}.zst"
          ls -lh "${IMG}.zst"

      - name: Upload image to release
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*.img.xz
