name: pi-gen manual build (hosted runner)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free disk (pi-gen can be huge on hosted runners)
      - name: Free disk space (aggressive)
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean
          df -h

      - name: Install pi-gen prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static debootstrap zerofree \
            zip dosfstools libarchive-tools rsync xz-utils \
            bc bison flex libssl-dev make pigz \
            libcap2-bin xxd file kmod gpg arch-test \
            binfmt-support

      - name: Enable binfmt_misc (host kernel)
        shell: bash
        run: |
          set -euxo pipefail
          sudo modprobe binfmt_misc
          if [ ! -d /proc/sys/fs/binfmt_misc ]; then
            echo "binfmt_misc not available"
            exit 1
          fi
          ls -la /proc/sys/fs/binfmt_misc || true

      # Optional but often helps ensure qemu handlers are registered
      - name: Register QEMU handlers (recommended)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Clean previous outputs
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf work deploy || true

      - name: Build pi-gen image
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo ./build.sh

      - name: Generate tag (run_number)
        id: tag
        shell: bash
        run: |
          set -euxo pipefail
          TAG="pi-gen-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          set -euxo pipefail
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Verify image exists
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh deploy/*.img.xz

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          sudo sha256sum deploy/*.img.xz | sudo tee deploy/SHA256SUMS.txt
          sudo cat deploy/SHA256SUMS.txt

      - name: Split image for GitHub release (<2GiB per part)
        shell: bash
        run: |
          set -euxo pipefail
          cd deploy
          IMG="$(ls -1 *.img.xz | head -n 1)"
          # Keep parts safely under GitHub's 2GiB release-asset limit
          sudo split -b 1900M "$IMG" "$IMG.part-"
          ls -lh "$IMG".part-*

      - name: Upload split image + checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pi-gen Image ${{ steps.tag.outputs.tag }}
          body: |
            This release contains the pi-gen image split into <2GiB parts due to GitHub Release asset limits.

            Reassemble on Linux/macOS:
            ```bash
            cat image*.img.xz.part-* > image.img.xz
            sha256sum -c SHA256SUMS.txt
            xz -t image.img.xz
            ```

            Then flash `image.img` after decompressing:
            ```bash
            xz -d image.img.xz
            # flash image.img with Raspberry Pi Imager or dd
            ```
          files: |
            deploy/*.img.xz.part-*
            deploy/SHA256SUMS.txt
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
