name: pi-gen manual build (hosted runner)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free disk (pi-gen can be huge on hosted runners)
      - name: Free disk space (aggressive)
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean
          df -h

      - name: Install pi-gen prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static debootstrap zerofree \
            zip dosfstools libarchive-tools rsync xz-utils \
            bc bison flex libssl-dev make pigz \
            libcap2-bin xxd file kmod gpg arch-test \
            binfmt-support

      - name: Enable binfmt_misc (host kernel)
        shell: bash
        run: |
          set -euxo pipefail
          sudo modprobe binfmt_misc
          if [ ! -d /proc/sys/fs/binfmt_misc ]; then
            echo "binfmt_misc not available"
            exit 1
          fi
          ls -la /proc/sys/fs/binfmt_misc || true

      # Optional but often helps ensure qemu handlers are registered
      - name: Register QEMU handlers (recommended)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Clean previous outputs
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf work deploy || true

      - name: Build pi-gen image
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          sudo -E ./build.sh

      - name: Generate tag (run_number)
        id: tag
        shell: bash
        run: |
          set -euxo pipefail
          TAG="pi-gen-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          set -euxo pipefail
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Verify image exists
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh deploy/*.img.xz

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail
          ( cd deploy
            sudo sha256sum *.img.xz | sudo tee SHA256SUMS.txt > /dev/null
          )
          sudo cat deploy/SHA256SUMS.txt

      - name: Decide split vs single upload
        id: assets
        shell: bash
        run: |
          set -euxo pipefail
          cd deploy
          IMG="$(ls -1 *.img.xz | head -n 1)"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

          # GitHub release asset limit is 2 GiB per file; use a safety margin.
          LIMIT_BYTES=$((2000 * 1024 * 1024))   # 2000MiB
          SIZE_BYTES="$(stat -c '%s' "$IMG")"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"

          if [ "$SIZE_BYTES" -le "$LIMIT_BYTES" ]; then
            echo "split=0" >> "$GITHUB_OUTPUT"
            echo "Will upload single asset: $IMG ($SIZE_BYTES bytes)"
          else
            echo "split=1" >> "$GITHUB_OUTPUT"
            echo "Will split: $IMG ($SIZE_BYTES bytes)"
          fi

      - name: Split image for GitHub release (<2GiB per part) only if needed
        if: steps.assets.outputs.split == '1'
        shell: bash
        run: |
          set -euxo pipefail
          cd deploy
          IMG="${{ steps.assets.outputs.img }}"
          sudo split -b 2000M "$IMG" "$IMG.part-"
          ls -lh "$IMG".part-*

      - name: Upload image (single or split) + checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pi-gen Image ${{ steps.tag.outputs.tag }}
          body: |
            This release contains the pi-gen image.

            If the image was split (because it exceeded GitHub's per-asset size limit), reassemble on Linux/macOS:
            ```bash
            cat image*.img.xz.part-* > image.img.xz
            sha256sum -c SHA256SUMS.txt
            xz -t image.img.xz
            ```

            If it was not split, just verify:
            ```bash
            sha256sum -c SHA256SUMS.txt
            xz -t image.img.xz
            ```

            Then flash `image.img` after decompressing:
            ```bash
            xz -d image.img.xz
            # flash image.img with Raspberry Pi Imager or dd
            ```

            ```powershell
            # Read the expected .img.xz filename from SHA256SUMS.txt
            # Supports formats like:
            #  filename
            #  *filename
            $line = Get-Content .\SHA256SUMS.txt | Where-Object { $_ -match "\.img\.xz(\s|$)" } | Select-Object -First 1
            if (-not $line) { throw "No .img.xz entry found in SHA256SUMS.txt" }

            $parts = $line.Trim() -split "\s+"
            $expectedHash = $parts[0].ToLower()
            $target = ($parts[-1] -replace '^\*','')

            Write-Host "Target: $target"
            Write-Host "Expected SHA256: $expectedHash"

            # If split parts exist, reassemble (fast + binary-safe)
            if (Test-Path ".\$target.part-aa") {
              cmd /c "copy /b $target.part-* $target" | Out-Null
            }

            # Verify SHA256
            $actualHash = (Get-FileHash ".\$target" -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $expectedHash) { throw "SHA256 mismatch! expected=$expectedHash actual=$actualHash" }
            Write-Host "SHA256 OK"

            # Test the .xz archive (requires xz.exe or 7z.exe in PATH)
            # xz -t ".\$target"
            # OR
            # 7z t ".\$target"
            ```
          files: |
            deploy/*.img.xz
            deploy/*.img.xz.part-*
            deploy/SHA256SUMS.txt
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
